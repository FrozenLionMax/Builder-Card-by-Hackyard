<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Builder Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>GitHub Builder Card</h1>
    <p class="subtitle">Enter a GitHub username to see their developer profile</p>

    <!-- Search Form -->
    <form id="searchForm">
      <input type="text" id="username" placeholder="GitHub username (e.g. FrozenLionMax, torvalds)" required>
      <button type="submit">Search</button>
    </form>

    <!-- Status Messages -->
    <div id="loading" class="status" style="display: none;">Loading profile...</div>
    <div id="error" class="status error" style="display: none;"></div>

    <!-- Builder Card -->
    <section id="card" class="card" style="display: none;">
      
      <!-- Profile Header -->
      <div class="profile-header">
        <img id="avatar" alt="Avatar">
        <div class="profile-info">
          <h2 id="name"></h2>
          <a id="profileLink" target="_blank" rel="noopener noreferrer"></a>
          <p id="bio"></p>
          <div class="stats">
            <span><strong id="reposCount">0</strong> Repos</span>
            <span><strong id="followersCount">0</strong> Followers</span>
            <span><strong id="followingCount">0</strong> Following</span>
          </div>
        </div>
      </div>

      <!-- Main Languages -->
      <div class="section">
        <h3>Main Languages</h3>
        <div id="languages" class="languages-list"></div>
      </div>

      <!-- Top Repositories -->
      <div class="section">
        <h3>Top Repositories</h3>
        <div id="repos" class="repos-grid"></div>
      </div>

      <!-- Recent Activity -->
      <div class="section">
        <h3>Recent Activity</h3>
        <ul id="activity" class="activity-list"></ul>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
